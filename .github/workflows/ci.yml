name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux · clean build (warnings as errors) + tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # `-warnings-as-errors` is here rather than in prose so "zero warnings" is
      # a machine-enforced claim. The checkout is clean, so this is a real
      # from-scratch compile of every file, not an up-to-date no-op.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # The consuming boundary's copy-elision is a release-mode property:
      # `consuming` proves unique ownership, and the ARC optimiser is what then
      # removes the retain that would make copy-on-write fire. At `-Onone` it
      # does not run. `testConsumingStagesMutateTheirInputBufferInPlace` skips
      # itself in a debug build and asserts here, so this job is what turns
      # "does not copy" from prose into a check that can go red.
      - name: Test (release — reaches the copy-elision assertions)
        run: swift test -c release

  ios:
    name: iOS Simulator · compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `generic/platform=iOS Simulator` deliberately, never a named device:
      # pinning to `name=iPhone 16` ties the job to whichever simulator runtimes
      # happen to be installed on that day's runner image, and a compile check
      # needs no device to exist.
      - name: List schemes
        run: xcodebuild -list

      - name: Build for iOS Simulator
        run: xcodebuild build -scheme ZeroCopyFeedUI -destination 'generic/platform=iOS Simulator'
